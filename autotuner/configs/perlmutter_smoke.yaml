# Quick smoke-test configuration: uses a tiny fraction of the node memory so
# each HPL run finishes in seconds/minutes instead of hours. It exercises the
# same full tunable parameter space and the same [0.80, 0.90] memory-fraction
# range as configs/perlmutter_hpl.yaml.
#
#   node_memory_bytes: 8GiB  ->  N ~= sqrt(0.85 * 8GiB / 8) ~= 30,500

experiment:
  name: hpl-smoke
  optimizer: random
  run_group: smoke
  budget: 3
  seed: 42

objective:
  metric: gflops
  direction: maximize

application:
  type: hpl
  executable: /global/common/software/m4007/opt/hpl-2.3/bin/xhpl
  node_memory_bytes: 8GiB
  memory_factor: 1.0
  memory_fraction_bounds: [0.80, 0.90]
  tunable:
    - N
    - NB
    - P
    - PMAP
    - PFACT
    - NBMIN
    - NDIV
    - RFACT
    - BCAST
    - DEPTH
    - SWAP
    - L1
    - U
    - EQUIL
  fixed:
    SWAP_THRESH: 64
    ALIGN: 8

slurm:
  account: m4007
  partition: null
  qos: regular_1
  constraint: cpu
  time: "00:30:00"
  exclusive: false
  nodes: 1
  ntasks: 128
  submit_retries: 3
  polling_interval: 60

outputs:
  root: null
