# Full HPL benchmark configuration for Perlmutter CPU nodes.
#
# Job structure follows the NERSC convention: the QoS (shared) and constraint
# (cpu) determine the queue, so no --partition is needed; the account charges
# the allocation. Nothing here is hard-coded in the framework, so the same code
# runs on any Slurm cluster.
#
#   experiment.optimizer     is overridden by the six drivers (random, smac3,
#                            raytune, hyperopt, deap, cmaes).
#   slurm.time               is the HPL *child* job time limit; the parent
#                            autotuner job should be given a much larger limit
#                            when launching (see scripts/launch_benchmark.sh
#                            --time) because it runs sequential children.
#
# Tunable parameters: the full HPL.dat set (mirrors the HPLtuning work):
#   N      problem size, bounded by the memory model so memory stays in the
#          [0.80, 0.90] band of the node's target HPL memory
#          (N = floor(sqrt(mem * 8)); max problem size at 100% ~= 174500)
#   NB     blocking factor
#   P      process grid; Q is derived as ntasks/P because HPL requires
#          P*Q == ntasks (tuning P therefore also varies Q)
#   PMAP, PFACT, NBMIN, NDIV, RFACT, BCAST, DEPTH, SWAP, L1, U, EQUIL
# Everything else (SWAP_THRESH, ALIGN) is fixed and recorded per evaluation.

experiment:
  name: hpl-benchmark
  optimizer: random
  run_group: random
  budget: 100
  seed: 42

objective:
  metric: gflops
  direction: maximize

application:
  type: hpl
  # Perlmutter CPU-node xhpl built with the Cray MPI wrapper.
  executable: /global/common/software/m4007/opt/hpl-2.3/bin/xhpl
  # Target HPL memory: N = sqrt(243840 MB / 8) ~= 174500 at 100%.
  node_memory_bytes: 243840MB
  # HPL memory model: memory ~= N^2 * 8 bytes (HPL FAQ).
  memory_factor: 1.0
  memory_fraction_bounds: [0.80, 0.90]
  tunable:
    - N
    - NB
    - P
    - PMAP
    - PFACT
    - NBMIN
    - NDIV
    - RFACT
    - BCAST
    - DEPTH
    - SWAP
    - L1
    - U
    - EQUIL
  fixed:
    SWAP_THRESH: 64
    ALIGN: 8

slurm:
  account: m4007
  partition: null
  qos: shared
  constraint: cpu
  time: "08:00:00"
  exclusive: false
  nodes: 1
  ntasks: 128
  submit_retries: 3
  polling_interval: 60

outputs:
  root: null
