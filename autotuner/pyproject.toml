[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hpc-autotuner"
version = "0.1.0"
description = "Automated performance tuning framework for HPC applications"

dependencies = []

[project.scripts]
hpc-tune = "hpc_autotuner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hpc_autotuner = [
    "resources/**/*"
]